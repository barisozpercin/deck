<meta charset="utf-8" />
<title>Microphones</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #171b21;
    --line: #2a313b;
    --text: #e6eaf0;
    --dim: #8b95a4;
    --accent: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; }

  header { padding: 20px 24px 10px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
  .hint { color: var(--dim); font-size: 13px; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 92px 92px;
    gap: 12px;
    padding: 6px 38px 6px 24px;
    color: var(--dim);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .columns div:not(:first-child) { text-align: center; }

  .list { overflow-y: auto; padding: 0 24px; }

  .row {
    display: grid;
    grid-template-columns: 1fr 92px 92px;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  .row.virtual { opacity: 0.75; border-style: dashed; }

  .name { font-weight: 600; }
  .sub { color: var(--dim); font-size: 12.5px; }
  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    border-radius: 5px;
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 11px;
    font-weight: 600;
    vertical-align: 1px;
  }

  .cell { display: flex; justify-content: center; }
  input[type=checkbox], input[type=radio] { width: 17px; height: 17px; accent-color: var(--accent); }

  .warning {
    margin: 0 24px 10px;
    padding: 12px 14px;
    border: 1px solid var(--warn);
    border-radius: 10px;
    color: var(--warn);
    font-size: 13px;
    display: none;
  }

  footer {
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  footer .note { color: var(--dim); font-size: 12.5px; }

  button {
    border-radius: 8px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #08130b;
  }
  button:hover { filter: brightness(1.12); }
</style>

<header>
  <h1>Which of these is your microphone?</h1>
  <div class="hint">
    <b>Mute</b> is what the MUTE tile switches off. <b>Room</b> is the one the noise monitor
    listens on — it should be a different device, so muting yourself doesn’t blind the monitor.
  </div>
</header>

<div class="columns"><div>Device</div><div>Mute</div><div>Room</div></div>

<div class="list" id="list"></div>

<div class="warning" id="warning"></div>

<footer>
  <div class="note">Changes apply immediately.</div>
  <button id="close">Done</button>
</footer>

<script>
  const post = (m) => window.chrome.webview.postMessage(m);
  const $ = (id) => document.getElementById(id);

  let rows = [];

  window.chrome.webview.addEventListener('message', (ev) => {
    if (ev.data.type !== 'devices') return;
    rows = ev.data.rows;
    render();
  });

  function currentSelection() {
    const muteIds = [...document.querySelectorAll('input[type=checkbox]')]
      .filter((c) => c.checked)
      .map((c) => c.dataset.id);

    const room = document.querySelector('input[type=radio]:checked');
    return { muteIds, roomId: room && room.dataset.id ? room.dataset.id : null };
  }

  function send() {
    post('set:' + JSON.stringify(currentSelection()));
  }

  function render() {
    const list = $('list');
    list.innerHTML = '';

    for (const r of rows) {
      const row = document.createElement('div');
      row.className = 'row' + (r.isVirtual ? ' virtual' : '');

      const info = document.createElement('div');
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = r.display;
      if (r.isVirtual) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = 'ROUTING CHANNEL';
        name.append(badge);
      }
      const sub = document.createElement('div');
      sub.className = 'sub';
      sub.textContent = r.isVirtual
        ? 'Not a microphone — muting this can break streaming or recording'
        : r.hardware;
      info.append(name, sub);

      const muteCell = document.createElement('div');
      muteCell.className = 'cell';
      const mute = document.createElement('input');
      mute.type = 'checkbox';
      mute.checked = r.muted;
      mute.dataset.id = r.id;
      mute.addEventListener('change', () => { checkWarnings(); send(); });
      muteCell.append(mute);

      const roomCell = document.createElement('div');
      roomCell.className = 'cell';
      const room = document.createElement('input');
      room.type = 'radio';
      room.name = 'room';
      room.checked = r.isRoom;
      room.dataset.id = r.id;
      room.addEventListener('change', () => { checkWarnings(); send(); });
      roomCell.append(room);

      row.append(info, muteCell, roomCell);
      list.append(row);
    }

    checkWarnings();
  }

  // Warn rather than forbid: it's the user's machine, but the consequence is invisible until
  // the night it matters, so it has to be spelled out.
  function checkWarnings() {
    const { muteIds, roomId } = currentSelection();
    const messages = [];

    if (roomId && muteIds.includes(roomId)) {
      messages.push('The room sensor is also being muted — the noise monitor will go deaf whenever you mute yourself, including at night.');
    }
    if (!roomId) {
      messages.push('No room sensor selected — the noise monitor has nothing to listen to.');
    }
    if (muteIds.length === 0) {
      messages.push('Nothing selected for Mute — the MUTE tile will do nothing.');
    }

    const virtualMuted = rows.filter((r) => r.isVirtual && muteIds.includes(r.id));
    if (virtualMuted.length) {
      messages.push('Muting a routing channel (' + virtualMuted.map((r) => r.display).join(', ') +
        ') can silently break streaming or recording.');
    }

    const warning = $('warning');
    warning.style.display = messages.length ? 'block' : 'none';
    warning.textContent = messages.join('  ');
  }

  $('close').addEventListener('click', () => post('close'));
</script>
