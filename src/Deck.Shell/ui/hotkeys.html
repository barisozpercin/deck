<meta charset="utf-8" />
<title>Deck shortcuts</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #171b21;
    --line: #2a313b;
    --text: #e6eaf0;
    --dim: #8b95a4;
    --accent: #3fb950;
    --warn: #d29922;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  body { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header { padding: 20px 24px 12px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
  .hint { color: var(--dim); font-size: 13px; }

  .list { overflow-y: auto; padding: 4px 24px; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 10px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 8px;
  }

  .combo {
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 13px;
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: #0e1116;
    white-space: nowrap;
  }
  .combo.empty { color: var(--dim); font-style: italic; font-family: inherit; }

  button {
    border-radius: 7px;
    padding: 7px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
  }
  button:hover { filter: brightness(1.15); }
  button.ghost { color: var(--dim); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08130b; }

  .conflicts {
    margin: 4px 24px 0;
    padding: 12px 14px;
    border: 1px solid var(--warn);
    border-radius: 10px;
    color: var(--warn);
    font-size: 13px;
    display: none;
  }

  footer {
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  footer .note { color: var(--dim); font-size: 12.5px; }
</style>

<header>
  <h1>Shortcuts</h1>
  <div class="hint">
    These work from any app, without moving your mouse to the deck. The tile stays as the thing
    that shows you the state.
  </div>
</header>

<div class="list" id="list"></div>

<div class="conflicts" id="conflicts"></div>

<footer>
  <div class="note">Shortcuts need a modifier, unless you use an F-key.</div>
  <button class="primary" id="close">Done</button>
</footer>

<script>
  const post = (m) => window.chrome.webview.postMessage(m);
  const $ = (id) => document.getElementById(id);

  window.chrome.webview.addEventListener('message', (ev) => {
    if (ev.data.type !== 'bindings') return;
    render(ev.data);
  });

  function render(data) {
    const list = $('list');
    list.innerHTML = '';

    for (const r of data.rows) {
      const row = document.createElement('div');
      row.className = 'row';

      const label = document.createElement('div');
      label.textContent = r.label;

      const combo = document.createElement('div');
      combo.className = 'combo' + (r.display ? '' : ' empty');
      combo.textContent = r.display || 'not set';

      const record = document.createElement('button');
      record.textContent = r.display ? 'Change' : 'Set';
      record.addEventListener('click', () => post('record:' + r.action));

      const clear = document.createElement('button');
      clear.className = 'ghost';
      clear.textContent = 'Clear';
      clear.disabled = !r.display;
      clear.addEventListener('click', () => post('clear:' + r.action));

      row.append(label, combo, record, clear);
      list.append(row);
    }

    const conflicts = $('conflicts');
    if (data.conflicts && data.conflicts.length) {
      conflicts.style.display = 'block';
      conflicts.textContent =
        'Windows refused these — another app already owns them: ' + data.conflicts.join(', ');
    } else {
      conflicts.style.display = 'none';
    }
  }

  $('close').addEventListener('click', () => post('close'));
</script>
