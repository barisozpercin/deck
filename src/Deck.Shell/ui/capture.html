<meta charset="utf-8" />
<title>Save a preset</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #171b21;
    --line: #2a313b;
    --text: #e6eaf0;
    --dim: #8b95a4;
    --accent: #3fb950;
    --danger: #f85149;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  body { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header { padding: 20px 24px 14px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
  .hint { color: var(--dim); font-size: 13px; }

  .list { overflow-y: auto; padding: 0 24px; }

  .row {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 12px;
    align-items: start;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  .row.off { opacity: 0.45; }

  .row input[type=checkbox] { width: 17px; height: 17px; margin-top: 2px; accent-color: var(--accent); }

  .app { font-weight: 600; }
  .title {
    color: var(--dim);
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .meta { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; }

  .url {
    grid-column: 2 / 4;
    margin-top: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .url label { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .url input {
    flex: 1;
    background: #0e1116;
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text);
    padding: 7px 10px;
    font: inherit;
    font-size: 13px;
  }
  .url input:focus { outline: none; border-color: var(--accent); }

  footer {
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 12px;
    align-items: center;
  }

  footer .name { flex: 1; display: flex; gap: 10px; align-items: center; }
  footer .name label { color: var(--dim); }
  footer .name input {
    flex: 1;
    max-width: 320px;
    background: #0e1116;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 12px;
    font: inherit;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  footer .name input:focus { outline: none; border-color: var(--accent); }

  button {
    border-radius: 8px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08130b; }
  button:hover { filter: brightness(1.12); }
</style>

<header>
  <h1>What belongs in this preset?</h1>
  <div class="hint">
    Everything open right now is listed below, pre-ticked. Untick anything that isn't part of
    this workspace — the deck will never move or close apps you leave out.
  </div>
</header>

<div class="list" id="list"></div>

<footer>
  <div class="name">
    <label for="preset-name">Name</label>
    <input id="preset-name" value="WORK" maxlength="14" spellcheck="false" />
  </div>
  <button id="cancel">Cancel</button>
  <button id="save" class="primary">Save preset</button>
</footer>

<script>
  const post = (m) => window.chrome.webview.postMessage(m);
  const $ = (id) => document.getElementById(id);

  let rows = [];

  window.chrome.webview.addEventListener('message', (ev) => {
    if (ev.data.type !== 'windows') return;
    rows = ev.data.rows;
    render();
  });

  function render() {
    const list = $('list');
    list.innerHTML = '';

    for (const r of rows) {
      const el = document.createElement('div');
      el.className = 'row';

      const tick = document.createElement('input');
      tick.type = 'checkbox';
      // Pre-ticked, except anything we couldn't work out how to relaunch.
      tick.checked = r.launchable;
      tick.dataset.index = r.index;
      tick.addEventListener('change', () => el.classList.toggle('off', !tick.checked));
      if (!tick.checked) el.classList.add('off');

      const main = document.createElement('div');
      const app = document.createElement('div');
      app.className = 'app';
      app.textContent = r.app;
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = r.launchable ? r.title : r.title + '  ·  can’t be relaunched';
      main.append(app, title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = r.monitor + (r.maximized ? ' · maximised' : '');

      el.append(tick, main, meta);

      // Only browsers get a URL box: a running browser window won't tell us which pages it
      // has, so this is typed once and remembered forever.
      if (r.isBrowser) {
        const wrap = document.createElement('div');
        wrap.className = 'url';
        const label = document.createElement('label');
        label.textContent = 'Open URL';
        const input = document.createElement('input');
        input.placeholder = 'https://…  (leave blank to just move the existing window)';
        input.spellcheck = false;
        input.dataset.urlFor = r.index;
        wrap.append(label, input);
        el.append(wrap);
      }

      list.append(el);
    }
  }

  $('cancel').addEventListener('click', () => post('cancel'));

  $('save').addEventListener('click', () => {
    const items = [];
    for (const tick of document.querySelectorAll('input[type=checkbox]')) {
      if (!tick.checked) continue;
      const index = Number(tick.dataset.index);
      const urlInput = document.querySelector(`input[data-url-for="${index}"]`);
      items.push({ index, url: urlInput ? urlInput.value : '' });
    }

    if (items.length === 0) {
      alert('Tick at least one window, or cancel.');
      return;
    }

    post('save:' + JSON.stringify({ name: $('preset-name').value, items }));
  });
</script>
