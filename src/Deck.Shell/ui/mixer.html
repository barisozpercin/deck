<meta charset="utf-8" />
<title>Volume mixer</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #171b21;
    --line: #2a313b;
    --text: #e6eaf0;
    --dim: #8b95a4;
    --accent: #3fb950;
    --danger: #f85149;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }

  body { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }

  header { padding: 20px 24px 12px; }
  h1 { margin: 0 0 4px; font-size: 19px; font-weight: 650; }
  .hint { color: var(--dim); font-size: 13px; }

  .list { overflow-y: auto; padding: 4px 24px; }

  .row {
    display: grid;
    grid-template-columns: 140px 1fr 44px 34px;
    gap: 12px;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--panel);
    margin-bottom: 8px;
  }
  .row.quiet { opacity: 0.55; }

  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 7px;
    vertical-align: 1px;
  }
  .row.quiet .dot { background: var(--dim); }

  input[type=range] { width: 100%; accent-color: var(--accent); }
  .value { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }

  .mute {
    border: 1px solid var(--line);
    background: #0e1116;
    color: var(--dim);
    border-radius: 7px;
    padding: 5px 0;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .mute.on { border-color: var(--danger); color: var(--danger); }

  .empty { color: var(--dim); padding: 20px 4px; }

  footer {
    padding: 14px 24px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  footer .note { color: var(--dim); font-size: 12.5px; }

  button.done {
    border-radius: 8px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #08130b;
  }
</style>

<header>
  <h1>Volume mixer</h1>
  <div class="hint">
    Per-app playback volume. A green dot means that app is making sound right now.
  </div>
</header>

<div class="list" id="list"><div class="empty">Looking for audio…</div></div>

<footer>
  <div class="note">Changes apply instantly.</div>
  <button class="done" id="close">Done</button>
</footer>

<script>
  const post = (m) => window.chrome.webview.postMessage(m);
  const $ = (id) => document.getElementById(id);

  let signature = '';

  window.chrome.webview.addEventListener('message', (ev) => {
    if (ev.data.type !== 'apps') return;

    // Only rebuild when the set of apps actually changes — re-rendering under the cursor
    // every second would make the sliders impossible to use.
    const next = ev.data.rows.map((r) => r.name + ':' + r.active).join('|');
    if (next === signature) return;

    signature = next;
    render(ev.data.rows);
  });

  function render(rows) {
    const list = $('list');
    list.innerHTML = '';

    if (rows.length === 0) {
      list.innerHTML = '<div class="empty">Nothing is playing audio.</div>';
      return;
    }

    for (const r of rows) {
      const row = document.createElement('div');
      row.className = 'row' + (r.active ? '' : ' quiet');

      const name = document.createElement('div');
      name.className = 'name';
      name.innerHTML = '<span class="dot"></span>';
      name.append(document.createTextNode(r.name));

      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = 0;
      slider.max = 100;
      slider.value = r.volume;

      const value = document.createElement('div');
      value.className = 'value';
      value.textContent = r.volume + '%';

      // Freeze refreshes while dragging, or the host would overwrite the handle mid-gesture.
      slider.addEventListener('pointerdown', () => post('editing:on'));
      slider.addEventListener('pointerup', () => post('editing:off'));
      slider.addEventListener('pointercancel', () => post('editing:off'));
      slider.addEventListener('input', () => {
        value.textContent = slider.value + '%';
        post('set:' + JSON.stringify({ name: r.name, volume: Number(slider.value) }));
      });

      const mute = document.createElement('button');
      mute.className = 'mute' + (r.muted ? ' on' : '');
      mute.textContent = r.muted ? 'off' : 'on';
      mute.addEventListener('click', () => {
        const next = !mute.classList.contains('on');
        mute.classList.toggle('on', next);
        mute.textContent = next ? 'off' : 'on';
        post('set:' + JSON.stringify({ name: r.name, muted: next }));
      });

      row.append(name, slider, value, mute);
      list.append(row);
    }
  }

  $('close').addEventListener('click', () => post('close'));
</script>
